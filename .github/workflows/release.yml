name: Publish image and chart
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.2.2
      - name: Check matching versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(helm show chart charts/rsdragonwilds | awk '/^version:/ {print $2}')" = "$version"
          test "$(helm show chart charts/rsdragonwilds | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}')" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/petzkod5/rsdragonwilds-server:${{ env.VERSION }}
          cache-from: type=gha
      - name: Publish Helm OCI chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_USER" --password-stdin
          helm package charts/rsdragonwilds --destination dist
          helm push "dist/rsdragonwilds-$VERSION.tgz" oci://ghcr.io/petzkod5/charts
