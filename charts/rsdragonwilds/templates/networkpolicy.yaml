{{- if .Values.metrics.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rsdw.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "rsdw.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: UDP, port: {{ .Values.server.port }}}
    {{- with .Values.metrics.networkPolicy.allowedPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {protocol: TCP, port: 7979}
    {{- end }}
{{- end }}
