{{- include "rsdw.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rsdw.name" . }}
  labels:
    {{- include "rsdw.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rsdw.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rsdw.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.saveSeed.existingClaim }}
      initContainers:
        - name: import-save
          image: {{ include "rsdw.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/opt/rsdwapi/seed-save.sh]
          args: [/seed, {{ .Values.saveSeed.path | quote }}, /home/steam/rsdw-dedicated/RSDragonwilds/Saved/SaveGames]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /home/steam/rsdw-dedicated}
            - {name: seed, mountPath: /seed, readOnly: true}
      {{- end }}
      containers:
        - name: server
          image: {{ include "rsdw.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - {name: game, containerPort: {{ .Values.server.port }}, protocol: UDP}
          env:
            - {name: RSDW_PORT, value: {{ .Values.server.port | quote }}}
            - {name: RSDWAPI_ENABLED, value: {{ .Values.api.enabled | quote }}}
            - {name: RSDWAPI_PORT, value: {{ .Values.api.port | quote }}}
            - {name: RSDWAPI_LOGGING, value: {{ .Values.api.logging.enabled | quote }}}
            - {name: RSDWAPI_VERBOSE, value: {{ .Values.api.logging.verbose | quote }}}
            {{- $overrides := dict }}
            {{- range .Values.server.extraEnv }}
            {{- $_ := set $overrides .name true }}
            {{- end }}
            {{- range $name, $value := .Values.server.env }}
            {{- if not (hasKey $overrides $name) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.api.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - >-
                  curl -fsS --max-time 3 -H "Authorization: Bearer $(cat /run/rsdwapi/token)"
                  http://127.0.0.1:{{ .Values.api.port }}/api/health | jq -e '.engineReady == true' >/dev/null
            periodSeconds: 15
            timeoutSeconds: 5
          {{- end }}
          volumeMounts:
            - {name: data, mountPath: /home/steam/rsdw-dedicated}
            {{- if .Values.api.enabled }}
            - {name: token, mountPath: /run/rsdwapi, readOnly: true}
            {{- end }}
            {{- if .Values.config.dedicatedServerIni }}
            - {name: config, mountPath: /etc/default/DedicatedServer.ini, subPath: DedicatedServer.ini, readOnly: true}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args: [--config.file=/etc/json-exporter/config.yml]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          ports:
            - {name: metrics, containerPort: 7979, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /etc/json-exporter, readOnly: true}
            - {name: token, mountPath: /run/rsdwapi, readOnly: true}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rsdw.claim" . }}
        {{- if .Values.saveSeed.existingClaim }}
        - name: seed
          persistentVolumeClaim:
            claimName: {{ .Values.saveSeed.existingClaim }}
            readOnly: true
        {{- end }}
        {{- if .Values.api.enabled }}
        - name: token
          secret:
            secretName: {{ .Values.api.bearerTokenSecret.name }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.api.bearerTokenSecret.key | quote }}, path: token}
        {{- end }}
        {{- if or .Values.metrics.enabled .Values.config.dedicatedServerIni }}
        - name: config
          configMap:
            name: {{ include "rsdw.name" . }}
        {{- end }}
